name: Auto Update VPN Subscription

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse and Test Keys
        run: python parser.py

      - name: Publish to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan gh-pages
          git rm -rf .
          
          # Копируем созданные файлы txt и json
          cp dist/* .
          rm -rf dist
          
          git add lite.txt plus.txt lite.json plus.json
          git commit -m "Hourly update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin gh-pages --force
