name: Auto Update VPN Subscription

on:
  schedule:
    - cron: '0 */1 * * *' # Запуск каждые 6 часов
  workflow_dispatch:      # Кнопка ручного запуска в интерфейсе

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser
        run: python parser.py

      - name: Deploy to gh-pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Создаем изолированную ветку без истории коммитов
          git checkout --orphan gh-pages
          git rm -rf .
          
          # Переносим сгенерированные файлы в корень ветки
          mv dist/* .
          rm -rf dist
          
          git add index.html raw.txt
          git commit -m "Auto-update subscription: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin gh-pages --force
