name: Auto Update VPN Subscription

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download sing-box
        run: |
          curl -sLo sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.10.7/sing-box-1.10.7-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-*/sing-box ./sing-box
          chmod +x ./sing-box
          rm -rf sing-box-* sing-box.tar.gz

      - name: Parse and Test Keys
        run: python parser.py

      - name: Publish to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan gh-pages
          git rm -rf .
          
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            cp -r dist/* .
            rm -rf dist
          else
            echo "Ошибка: dist пуста"
            exit 1
          fi
          
          git add -A
          git commit -m "Hourly update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "No changes"
          git push origin gh-pages --force
